<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 6" width="100%" height="6">
  <defs>
    <linearGradient id="laser-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="1">
        <animate attributeName="offset" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <filter id="laser-glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="1" width="900" height="3" rx="1.5" fill="url(#laser-flow)" filter="url(#laser-glow)" />
</svg>
